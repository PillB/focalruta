[pytest]
# A hanging test must fail with a stack dump rather than killing the job with no
# traceback. 600 s is far above the slowest test (full regeneration, ~90 s) and
# far below any plausible CI limit.
#
# This option needs pytest-timeout, which .github/workflows/quality.yml installs.
# Without the plugin pytest ignores it and warns "Unknown config option: timeout"
# — the run still works, but locally there is no hang protection. Install it with
#   python3 -m pip install pytest-timeout
# if you want the same safety net the CI job has.
timeout = 600
testpaths = tests
