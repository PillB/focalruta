[pytest]
# A hanging test must fail with a stack dump rather than killing the job with no
# traceback. 600 s is far above the slowest test (full regeneration, ~90 s) and
# far below any plausible CI limit.
#
# This option needs pytest-timeout. Without the plugin pytest ignores it and
# warns "Unknown config option: timeout" — the run still works, but there is no
# hang protection. Install the full set to get the same net CI has:
#   python3 -m pip install -r requirements-dev.txt
timeout = 600
testpaths = tests
