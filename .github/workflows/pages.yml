name: Deploy FocalRuta to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default; only the deploy job can write to Pages, not the live check it calls.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/canon6d_sota_hosted
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  live-check:
    needs: deploy
    uses: ./.github/workflows/live-check.yml
